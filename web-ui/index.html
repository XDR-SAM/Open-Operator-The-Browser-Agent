<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autonomous Browser Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0a0c0f;
    --surface:   #0f1215;
    --border:    #1e2530;
    --accent:    #00d4ff;
    --accent2:   #7c3aed;
    --green:     #00ff88;
    --yellow:    #fbbf24;
    --red:       #f87171;
    --text:      #c9d1d9;
    --muted:     #4a5568;
    --mono:      'JetBrains Mono', monospace;
    --sans:      'Space Grotesk', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  .logo-icon { font-size: 20px; }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .status-dot.active {
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.5; }
  }

  /* ── Layout ── */
  .workspace {
    display: grid;
    grid-template-columns: 380px 1fr;
    height: calc(100vh - 57px);
    overflow: hidden;
  }

  /* ── Left panel ── */
  .panel-left {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
  }

  .panel-section {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }

  .panel-label {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 12px;
    resize: vertical;
    min-height: 80px;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.5;
  }
  textarea:focus { border-color: var(--accent); }

  .provider-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }

  .provider-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    padding: 8px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .provider-btn:hover { border-color: var(--accent); color: var(--accent); }
  .provider-btn.selected {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0, 212, 255, 0.06);
  }

  .run-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    border: none;
    border-radius: 8px;
    color: #000;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    padding: 13px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 14px;
  }
  .run-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
  .run-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* Preset tasks */
  .preset {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    padding: 7px 10px;
    cursor: pointer;
    display: block;
    width: 100%;
    text-align: left;
    margin-bottom: 6px;
    transition: all 0.15s;
    line-height: 1.4;
  }
  .preset:hover { border-color: var(--accent); color: var(--text); }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .stat-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 10px;
    text-align: center;
  }
  .stat-value {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-label {
    font-size: 10px;
    color: var(--muted);
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* ── Right panel: terminal log ── */
  .panel-right {
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  .terminal-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .terminal-title {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin-left: 6px;
  }

  .log-container {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.7;
  }
  .log-container::-webkit-scrollbar { width: 6px; }
  .log-container::-webkit-scrollbar-track { background: transparent; }
  .log-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .log-entry { margin-bottom: 10px; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .log-entry .ts { color: var(--muted); font-size: 11px; margin-right: 8px; }

  .log-step-header { color: var(--yellow); font-weight: 700; margin-bottom: 4px; }
  .log-thought     { color: var(--accent); margin-left: 16px; }
  .log-action      { color: var(--green);  margin-left: 16px; }
  .log-observe     { color: var(--text);   margin-left: 16px; opacity: 0.85; }
  .log-error       { color: var(--red);    margin-left: 16px; }
  .log-done        { color: var(--green);  font-weight: 700; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px; }
  .log-system      { color: var(--muted);  font-style: italic; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    gap: 12px;
  }
  .empty-icon { font-size: 48px; opacity: 0.3; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-icon">🤖</span>
    AUTONOMOUS BROWSER AGENT
  </div>
  <div style="display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted);">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Idle</span>
  </div>
</header>

<div class="workspace">
  <!-- ── Left Panel ── -->
  <div class="panel-left">

    <div class="panel-section">
      <div class="panel-label">Task</div>
      <textarea id="taskInput" placeholder="Enter your task in natural language…&#10;&#10;e.g. Search Google for AI news and extract top 5 titles"></textarea>
      <div class="provider-grid">
        <button class="provider-btn selected" data-p="claude"   onclick="setProvider(this)">Claude</button>
        <button class="provider-btn"          data-p="openai"   onclick="setProvider(this)">OpenAI</button>
        <button class="provider-btn"          data-p="ollama"   onclick="setProvider(this)">Ollama</button>
        <button class="provider-btn"          data-p="lmstudio" onclick="setProvider(this)">LM Studio</button>
      </div>
      <button class="run-btn" id="runBtn" onclick="runTask()">▶ RUN TASK</button>
    </div>

    <div class="panel-section">
      <div class="panel-label">Preset Tasks</div>
      <button class="preset" onclick="setTask(this.textContent)">Search Google for top 5 AI news articles and extract the titles</button>
      <button class="preset" onclick="setTask(this.textContent)">Navigate to books.toscrape.com and list all book titles with prices</button>
      <button class="preset" onclick="setTask(this.textContent)">Go to example.com, take a screenshot, and describe the page</button>
      <button class="preset" onclick="setTask(this.textContent)">Search DuckDuckGo for "Playwright automation" and click the first result</button>
    </div>

    <div class="panel-section" style="flex:1">
      <div class="panel-label">Session Stats</div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="statSteps">0</div>
          <div class="stat-label">Steps</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statErrors">0</div>
          <div class="stat-label">Errors</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statTime">0s</div>
          <div class="stat-label">Elapsed</div>
        </div>
      </div>
    </div>

  </div>

  <!-- ── Right Panel: Terminal ── -->
  <div class="panel-right">
    <div class="terminal-header">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <span class="terminal-title">agent-output — bash</span>
    </div>
    <div class="log-container" id="logContainer">
      <div class="empty-state">
        <div class="empty-icon">⬛</div>
        <div>Enter a task and press RUN to start the agent</div>
      </div>
    </div>
  </div>
</div>

<script>
let ws = null;
let selectedProvider = 'claude';
let startTime = null;
let timerInterval = null;
let stepCount = 0;
let errorCount = 0;

// ── WebSocket ─────────────────────────────────────────────
function connectWS() {
  ws = new WebSocket(`ws://${location.host}`);
  ws.onmessage = e => handleMessage(JSON.parse(e.data));
  ws.onclose   = () => setTimeout(connectWS, 2000);
}
connectWS();

function handleMessage({ type, data }) {
  switch (type) {
    case 'task_start': onTaskStart(data); break;
    case 'step':       onStep(data);      break;
    case 'task_done':  onTaskDone(data);  break;
    case 'error':      onError(data);     break;
  }
}

// ── Helpers ───────────────────────────────────────────────
function setProvider(btn) {
  document.querySelectorAll('.provider-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedProvider = btn.dataset.p;
}

function setTask(text) {
  document.getElementById('taskInput').value = text;
}

function ts() {
  return new Date().toLocaleTimeString();
}

function log(html) {
  const container = document.getElementById('logContainer');
  const el = document.createElement('div');
  el.className = 'log-entry';
  el.innerHTML = html;
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
}

function setStatus(label, active) {
  document.getElementById('statusDot').className = 'status-dot' + (active ? ' active' : '');
  document.getElementById('statusText').textContent = label;
}

// ── Task lifecycle ────────────────────────────────────────
async function runTask() {
  const task = document.getElementById('taskInput').value.trim();
  if (!task) return alert('Please enter a task first.');

  document.getElementById('runBtn').disabled = true;
  document.getElementById('logContainer').innerHTML = '';
  stepCount = 0; errorCount = 0;
  updateStats();

  const res = await fetch('/api/run', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ task, provider: selectedProvider }),
  });

  if (!res.ok) {
    const err = await res.json();
    log(`<div class="log-error">❌ ${err.error}</div>`);
    document.getElementById('runBtn').disabled = false;
  }
}

function onTaskStart({ task, provider }) {
  startTime = Date.now();
  setStatus('Running…', true);
  timerInterval = setInterval(updateTimer, 1000);

  log(`<div class="log-system"><span class="ts">${ts()}</span>▶ Task started with ${provider}</div>`);
  log(`<div class="log-system"><span class="ts">${ts()}</span>📋 "${task}"</div>`);
}

function onStep(step) {
  stepCount++;
  if (step.error) errorCount++;
  updateStats();

  log(`
    <div class="log-step-header"><span class="ts">${ts()}</span>── Step ${step.stepNo} ──────────────</div>
    <div class="log-thought">💭 ${step.thought}</div>
    <div class="log-action">⚡ ${JSON.stringify(step.action)}</div>
    <div class="log-observe">👁  ${step.observation?.slice(0, 300) ?? ''}</div>
    ${step.error ? `<div class="log-error">❌ ${step.error}</div>` : ''}
  `);
}

function onTaskDone({ success, result }) {
  clearInterval(timerInterval);
  setStatus('Done', false);
  document.getElementById('runBtn').disabled = false;

  log(`
    <div class="log-done">
      ${success ? '✅' : '❌'} TASK ${success ? 'COMPLETE' : 'FAILED'}<br>
      Result: ${result}
    </div>
  `);
}

function onError({ message }) {
  clearInterval(timerInterval);
  setStatus('Error', false);
  document.getElementById('runBtn').disabled = false;
  log(`<div class="log-error">❌ Agent error: ${message}</div>`);
}

function updateStats() {
  document.getElementById('statSteps').textContent  = stepCount;
  document.getElementById('statErrors').textContent = errorCount;
}

function updateTimer() {
  if (!startTime) return;
  const s = Math.round((Date.now() - startTime) / 1000);
  document.getElementById('statTime').textContent = `${s}s`;
}
</script>
</body>
</html>
